<text x="56.0" y="364.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">String consumed AND stack empty → balanced. The three failure modes: wrong closer</text>
<text x="56.0" y="383.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">("(]"), leftover openers ("(("), closer with empty stack (")").</text>
